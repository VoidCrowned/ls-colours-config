name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck ls_colours_config tests/run.sh
      # The test files are fragments sourced by run.sh: no shebang, and their
      # variables are defined and used in other files.
      - run: shellcheck -s bash -e SC2148,SC2034,SC2154 tests/t_*.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash --version | head -n 1 && ls --version | head -n 1
      - run: bash tests/run.sh --json

  tests-bash-4-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The official bash image is Alpine with BusyBox, so GNU coreutils are added.
      - run: >
          docker run --rm -v "$PWD:/repo" -w /repo bash:4.0 sh -c
          'apk add --no-cache coreutils >/dev/null && bash --version | head -n 1 && bash tests/run.sh --json'
